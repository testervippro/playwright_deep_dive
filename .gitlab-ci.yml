image: node:lts

stages:
  - test
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

test_playwright:
  stage: test
  image: mcr.microsoft.com/playwright:v1.47.0-jammy
  script:
    - npm ci
    - npx playwright install --with-deps
    - xvfb-run npx playwright test --reporter=html || true  # Don't fail job if tests fail
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 1 week

pages:
  stage: deploy
  image: node:lts
  needs:
    - job: test_playwright   # ensure artifacts are downloaded
  script:
    - mkdir public
    - cp -r playwright-report/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
